# Build linux/amd64 Sure image from the pinned Pluggy PR SHA and push to GHCR.
# No repository secrets required - uses the job GITHUB_TOKEN only.
# Intended for the parallel sure-pluggy Unraid stack (not live 0.7.4).

name: Publish Pluggy amd64 image

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Git commit SHA to build (Pluggy PR tip)"
        required: true
        type: string
        default: "4e900a94c19f81c7879c430a644e5c9e09f62f80"
      push:
        description: "Push image tags to ghcr.io"
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEFAULT_SOURCE_SHA: 4e900a94c19f81c7879c430a644e5c9e09f62f80

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build linux/amd64 and push
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      image_digest: ${{ steps.push.outputs.digest }}
      short_sha: ${{ steps.verify.outputs.short_sha }}
      source_sha: ${{ steps.verify.outputs.full_sha }}

    steps:
      - name: Resolve source SHA
        id: meta
        shell: bash
        run: |
          SOURCE_SHA="${{ github.event.inputs.source_sha || env.DEFAULT_SOURCE_SHA }}"
          if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid source_sha: ${SOURCE_SHA}" >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "Building source_sha=${SOURCE_SHA}"

      - name: Check out pinned source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false
          ref: ${{ steps.meta.outputs.source_sha }}

      - name: Verify checked-out commit
        id: verify
        shell: bash
        run: |
          FULL="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short=7 HEAD)"
          EXPECTED="${{ steps.meta.outputs.source_sha }}"
          case "${FULL}" in
            ${EXPECTED}*) ;;
            *)
              case "${EXPECTED}" in
                ${FULL}*) ;;
                *)
                  echo "Checkout mismatch: got ${FULL}, expected ${EXPECTED}" >&2
                  exit 1
                  ;;
              esac
              ;;
          esac
          echo "full_sha=${FULL}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${SHORT}" >> "${GITHUB_OUTPUT}"
          echo "Checked out ${FULL} (short ${SHORT})"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push linux/amd64
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          build-args: BUILD_COMMIT_SHA=${{ steps.verify.outputs.full_sha }}
          platforms: linux/amd64
          push: ${{ inputs.push }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pluggy-2861
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.verify.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.verify.outputs.full_sha }}
            org.opencontainers.image.title=Sure (Pluggy PR 2861)
            org.opencontainers.image.description=Parallel-test image from fork branch pluggy-2861; not upstream release
          provenance: false
          cache-from: type=gha,scope=pluggy-amd64
          cache-to: type=gha,mode=max,scope=pluggy-amd64

      - name: Print image refs
        shell: bash
        run: |
          echo "Image tags:"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pluggy-2861"
          echo "  ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.verify.outputs.short_sha }}"
          echo "Digest: ${{ steps.push.outputs.digest }}"
          echo "Source SHA: ${{ steps.verify.outputs.full_sha }}"
